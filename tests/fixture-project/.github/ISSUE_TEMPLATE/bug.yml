name: Report a problem
description: Something did not work as expected.
title: "[bug] "
labels: ["type:bug", "stage:intake"]
body:
  - type: markdown
    attributes:
      value: |
        **This repository is public.** Do not paste personal data, passwords or tokens.
  - type: textarea
    id: what_happened
    attributes:
      label: What happened
      description: In your own words. What did you do, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: redacted_output
    attributes:
      label: Output, with personal details removed
      description: Error text or logs.
      render: text
  - type: input
    id: context
    attributes:
      label: Context
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed names, email addresses, phone numbers and tokens from everything above.
          required: true
