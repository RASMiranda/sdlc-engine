[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-engine"
version = "0.2.1"
description = "The deterministic half of an agentic SDLC: decides, checks and frames what agents do; the workflow only calls it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/RASMiranda/sdlc-engine"
Repository = "https://github.com/RASMiranda/sdlc-engine"
Issues = "https://github.com/RASMiranda/sdlc-engine/issues"
Changelog = "https://github.com/RASMiranda/sdlc-engine/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
